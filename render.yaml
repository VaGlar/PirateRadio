services:
  - type: web
    name: pirateradio-bridge
    env: docker
    dockerfilePath: ./bridge/Dockerfile
    dockerContext: ./bridge
    plan: free
    envVars:
      # Icecast now runs on Fly.io (see icecast/fly.toml) — the bridge talks
      # to it over its public URL, e.g.:
      #   ICECAST_HOST = pirateradio-icecast.fly.dev
      #   ICECAST_PORT = 443
      - key: ICECAST_HOST
        sync: false
      - key: ICECAST_PORT
        sync: false
      - key: ICECAST_SOURCE_PASSWORD
        sync: false
      - key: ICECAST_MOUNT
        value: /radio.mp3
      - key: BROADCAST_PASSWORD
        sync: false
