app = "pirateradio-bridge"
primary_region = "fra"

[build]

[env]
  # Fly's internal 6PN DNS (pirateradio-icecast.internal) refused the
  # connection even with a single, running Icecast machine — untested and
  # apparently not working as expected. Falling back to the public HTTPS
  # path, which already proved it works end-to-end (mount registered, real
  # audio flowed) when the bridge was still on Render — the only variable
  # changing now is that the connection originates from Fly instead.
  ICECAST_HOST = "pirateradio-icecast.fly.dev"
  ICECAST_PORT = "443"
  ICECAST_MOUNT = "/radio.mp3"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
