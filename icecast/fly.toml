app = "pirateradio-icecast"
primary_region = "fra"

[build]

[env]
  ICECAST_HOSTNAME = "pirateradio-icecast.fly.dev"

# Icecast's source protocol needs a raw, indefinite-length connection.
# Fly's [http_service] is an HTTP-aware proxy that buffers/parses requests —
# it silently dropped the audio after ~30s without ever forwarding it to
# Icecast (confirmed: Icecast's own status page never showed the mount even
# while the source was actively streaming real audio for 30+ seconds).
# [[services]] in tcp mode is a raw byte passthrough instead — TLS is
# terminated at Fly's edge, everything after that is forwarded untouched,
# same as a direct connection with no proxy in front at all.
[[services]]
  protocol = "tcp"
  internal_port = 8000
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
