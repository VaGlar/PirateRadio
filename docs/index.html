<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pirate Radio</title>
<style>
  :root {
    --bg: #1c1917;
    --panel: #26221f;
    --border: #3a352f;
    --gold: #d9a441;
    --text: #ece7e1;
    --muted: #8f887e;
  }
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    max-width: 440px;
    margin: 0 auto;
    padding: 64px 20px 60px;
    text-align: center;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  h1 { font-size: 1.9rem; margin: 0 0 6px; color: var(--text); }
  p.tagline { color: var(--muted); font-size: 0.92rem; margin: 0 0 28px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  audio { width: 100%; margin: 0; }

  input, textarea {
    width: 100%;
    padding: 11px 12px;
    font-size: 0.95rem;
    margin: 8px 0;
    box-sizing: border-box;
    font-family: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); }

  button {
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: var(--gold);
    color: #1c1917;
    width: 100%;
  }
  button:hover { filter: brightness(1.08); }

  #chatBox { margin-top: 26px; text-align: left; }
  #chatBox h2 { font-size: 0.9rem; font-weight: 600; color: var(--muted); text-align: center; margin: 0 0 4px; }
  #chatStatus { font-size: 0.8rem; color: var(--muted); text-align: center; min-height: 1.2em; margin-top: 6px; }

  /* Neon "ON AIR" sign — dim/unlit until the listener actually presses play. */
  #onairSign {
    margin: 0 0 20px;
    padding: 26px 10px;
    border-radius: 12px;
    background:
      repeating-linear-gradient(0deg, #2a2420, #2a2420 17px, #241f1b 17px, #241f1b 19px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0 40px, rgba(0,0,0,0) 40px 80px);
    border: 1px solid var(--border);
  }
  #onairSign span {
    font-family: 'Georgia', serif;
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 0.14em;
    color: transparent;
    -webkit-text-stroke: 1.5px #5a5048;
    transition: color 250ms, text-shadow 250ms, -webkit-text-stroke-color 250ms;
  }
  #onairSign.lit span {
    color: #ff5a4d;
    -webkit-text-stroke-color: #ffcf8a;
    text-shadow:
      0 0 6px #ff5a4d,
      0 0 16px #ff5a4d,
      0 0 6px #ffcf8a,
      0 0 34px #d9a441,
      0 0 55px #d9a441;
  }
</style>
</head>
<body>
  <h1>🏴‍☠️ Pirate Radio</h1>
  <p class="tagline">Πάτησε play για να ακούσεις την εκπομπή.</p>

  <div id="onairSign"><span>ON AIR</span></div>

  <div class="panel">
    <audio id="radioPlayer" controls preload="none" src="https://pirateradio-icecast.fly.dev/radio.mp3">
      Ο browser σου δεν υποστηρίζει audio.
    </audio>

    <div id="chatBox">
      <h2>📨 Στείλε μήνυμα στην εκπομπή</h2>
      <input id="chatName" type="text" placeholder="Το όνομά σου (προαιρετικό)" maxlength="40" />
      <textarea id="chatMessage" rows="2" placeholder="Μήνυμα..." maxlength="300"></textarea>
      <button id="chatSend" type="button">Αποστολή</button>
      <div id="chatStatus"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
