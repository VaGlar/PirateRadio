<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pirate Radio</title>
<style>
  :root {
    --bg: #1c1917;
    --panel: #26221f;
    --border: #3a352f;
    --gold: #d9a441;
    --text: #ece7e1;
    --muted: #8f887e;
  }
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    max-width: 440px;
    margin: 0 auto;
    padding: 64px 20px 60px;
    text-align: center;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  h1 { font-size: 1.9rem; margin: 0 0 6px; color: var(--text); }
  p.tagline { color: var(--muted); font-size: 0.92rem; margin: 0 0 28px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  audio { width: 100%; margin: 0; }

  input, textarea {
    width: 100%;
    padding: 11px 12px;
    font-size: 0.95rem;
    margin: 8px 0;
    box-sizing: border-box;
    font-family: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); }

  button {
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: var(--gold);
    color: #1c1917;
    width: 100%;
  }
  button:hover { filter: brightness(1.08); }

  #chatBox { margin-top: 26px; text-align: left; }
  #chatBox h2 { font-size: 0.9rem; font-weight: 600; color: var(--muted); text-align: center; margin: 0 0 4px; }
  #chatStatus { font-size: 0.8rem; color: var(--muted); text-align: center; min-height: 1.2em; margin-top: 6px; }
</style>
</head>
<body>
  <h1>🏴‍☠️ Pirate Radio</h1>
  <p class="tagline">Πάτησε play για να ακούσεις την εκπομπή.</p>

  <div class="panel">
    <audio controls preload="none" src="https://pirateradio-icecast.fly.dev/radio.mp3">
      Ο browser σου δεν υποστηρίζει audio.
    </audio>

    <div id="chatBox">
      <h2>📨 Στείλε μήνυμα στην εκπομπή</h2>
      <input id="chatName" type="text" placeholder="Το όνομά σου (προαιρετικό)" maxlength="40" />
      <textarea id="chatMessage" rows="2" placeholder="Μήνυμα..." maxlength="300"></textarea>
      <button id="chatSend" type="button">Αποστολή</button>
      <div id="chatStatus"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
