<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pirate Radio — On Air</title>
<style>
  :root {
    --bg: #1c1917;
    --panel: #26221f;
    --border: #3a352f;
    --gold: #d9a441;
    --text: #ece7e1;
    --muted: #8f887e;
    --red: #cf5454;
    --mute-grey: #d8d3c9;
  }
  * { box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    max-width: 440px;
    margin: 0 auto;
    padding: 44px 20px 60px;
    text-align: center;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 200ms;
  }
  body.muted-bg { background: #211f1c; }

  h1 { font-size: 1.35rem; margin: 0 0 24px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    text-align: left;
  }

  input[type="password"], input[type="text"] {
    width: 100%; padding: 11px 12px; font-size: 0.95rem; margin: 8px 0; box-sizing: border-box;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  }
  input::placeholder { color: var(--muted); }
  input:focus { outline: none; border-color: var(--gold); }

  button { padding: 12px 24px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; border-radius: 8px; }
  #startBtn { background: var(--gold); color: #1c1917; width: 100%; }
  #stopBtn { background: var(--red); color: white; width: 100%; margin-top: 10px; }
  #status { margin-top: 18px; font-weight: bold; text-align: center; color: var(--muted); }
  #error { color: var(--red); margin-top: 10px; font-size: 0.9rem; text-align: center; }

  select {
    width: 100%; padding: 10px; font-size: 0.95rem; margin: 6px 0 12px; box-sizing: border-box;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  }
  label { display: block; text-align: left; font-size: 0.82rem; color: var(--muted); margin-top: 10px; }
  #testBtn { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 100%; margin-bottom: 10px; }

  #meterWrap { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; height: 14px; overflow: hidden; margin: 8px 0 4px; }
  #meterBar { background: var(--gold); height: 100%; width: 0%; transition: width 60ms linear; }
  #meterHint { font-size: 0.78rem; color: var(--muted); }

  /* Mute button doubles as the neon "ON AIR" sign — lit and glowing while
     live, unlit and pulsing while muted. Deliberately loud: this is the
     one thing that must be impossible to miss while live. */
  #muteBtn {
    display: none;
    width: 100%;
    padding: 22px 10px;
    border-radius: 12px;
    margin-bottom: 16px;
    cursor: pointer;
    border: 1px solid var(--border);
    background:
      repeating-linear-gradient(0deg, #2a2420, #2a2420 17px, #241f1b 17px, #241f1b 19px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0 40px, rgba(0,0,0,0) 40px 80px);
  }
  #muteBtn span {
    font-family: 'Georgia', serif;
    font-size: 1.6rem;
    font-weight: bold;
    letter-spacing: 0.12em;
    color: #ff5a4d;
    text-shadow:
      0 0 6px #ff5a4d,
      0 0 16px #ff5a4d,
      0 0 6px #ffcf8a,
      0 0 34px #d9a441,
      0 0 55px #d9a441;
    transition: color 250ms, text-shadow 250ms, -webkit-text-stroke-color 250ms;
  }
  #muteBtn.muted span {
    color: transparent;
    -webkit-text-stroke: 1.5px var(--mute-grey);
    text-shadow: none;
    animation: mutePulse 0.9s infinite;
  }
  @keyframes mutePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  #muteHint { display: none; font-size: 0.78rem; color: var(--muted); margin: -8px 0 14px; text-align: center; }

  #liveControls { display: none; }
  .checkRow { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; margin: 8px 0; }
  .checkRow input { width: auto; margin: 0; accent-color: var(--gold); }
  #mixSliderWrap { display: none; margin-top: 10px; }
  #mixSliderWrap .labels { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); }
  input[type="range"] { width: 100%; margin: 2px 0 6px; accent-color: var(--gold); }

  #liveStats { display: none; }
  #liveStats .row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 4px 0; }
  #liveStats .row b { font-variant-numeric: tabular-nums; color: var(--gold); }
  #inbox { display: none; }
  #inbox h3 { font-size: 0.95rem; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  #inboxList { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  #inboxList .msg { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
  #inboxList .msg .name { font-weight: bold; color: var(--gold); }
  #inboxList .msg .time { float: right; color: var(--muted); font-size: 0.75rem; }
  #inboxEmpty { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
  <h1 style="text-align:center">🏴‍☠️ Pirate Radio — Broadcaster</h1>

  <!-- Before On Air -->
  <div id="setup" class="panel">
    <input id="password" type="password" placeholder="Κωδικός εκπομπής" />

    <label for="micSelect">Μικρόφωνο</label>
    <select id="micSelect"><option value="">(προεπιλογή συστήματος)</option></select>
    <button id="testBtn" type="button">🎤 Δοκιμή μικροφώνου</button>

    <div id="meterWrap"><div id="meterBar"></div></div>
    <div id="meterHint">Μίλησε δυνατά — η μπάρα πρέπει να κινείται.</div>

    <button id="startBtn">🎙️ On Air</button>
  </div>

  <!-- While On Air -->
  <button id="muteBtn" type="button"><span id="muteBtnText">ON AIR</span></button>
  <div id="muteHint">Πλήκτρο <b>Space</b> κάνει το ίδιο (όσο δεν πληκτρολογείς σε πεδίο).</div>

  <div id="liveControls" class="panel">
    <div class="checkRow">
      <input id="sysAudioCheck" type="checkbox" />
      <label for="sysAudioCheck" style="margin:0">🎵 Spotify</label>
    </div>
    <div id="mixSliderWrap">
      <div class="labels"><span>🎤 Μικρόφωνο</span><span>🎵 Μουσική</span></div>
      <input id="mixSlider" type="range" min="0" max="100" step="1" value="50" />
    </div>
    <div class="checkRow">
      <input id="monitorToggle" type="checkbox" checked />
      <label for="monitorToggle" style="margin:0">🎧 Άκου τον εαυτό σου</label>
    </div>
  </div>

  <button id="stopBtn" style="display:none">⏹ Off Air</button>

  <div id="status">Off air</div>
  <div id="error"></div>

  <div id="liveStats" class="panel">
    <div class="row"><span>⏱️ Διάρκεια</span><b id="elapsed">00:00</b></div>
    <div class="row"><span>🎧 Ακροατές τώρα</span><b id="listenerCount">—</b></div>
    <div class="row"><span>📈 Peak ακροατές</span><b id="peakCount">—</b></div>
  </div>

  <div id="inbox" class="panel">
    <h3>📨 Μηνύματα ακροατών</h3>
    <div id="inboxList"><div id="inboxEmpty">Κανένα μήνυμα ακόμα.</div></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
